<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>右昌體育</title>
<meta name="description" content="右昌國小體育班 — 公告、請假、課表、比賽資訊">
<meta name="robots" content="noindex,nofollow">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1a1a2e; --muted:#6b7280;
    --brand:#1a237e; --brand-light:#e8eaf6; --accent:#1565c0;
    --line:#e5e7eb; --shadow:0 2px 12px rgba(26,35,126,.08);
    --radius:14px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ── Header ── */
  .header{
    color:#fff; padding:28px 16px 22px; text-align:center;
    position:relative; overflow:hidden;
    background:url('header-bg.jpg') center bottom / cover no-repeat;
    min-height:160px;
  }
  /* 半透明遮罩讓文字清晰可讀 */
  .header::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.2) 100%);
    z-index:0;
  }
  .header::after{
    content:''; position:absolute; bottom:-30px; left:50%; transform:translateX(-50%);
    width:120%; height:60px; background:var(--bg); border-radius:50% 50% 0 0;
    z-index:1;
  }
  .logo-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    position:relative; z-index:2;
  }
  .logo-row img{height:88px; filter:drop-shadow(0 3px 10px rgba(0,0,0,.2))}
  .logo-text h1{font-size:30px; font-weight:900; letter-spacing:2px; color:#1a237e; text-shadow:0 1px 4px rgba(255,255,255,.8)}
  .logo-text .sub{font-size:12.5px; color:#2c3e50; margin-top:3px; letter-spacing:.5px; text-shadow:0 1px 2px rgba(255,255,255,.6)}

  /* ── Nav ── */
  .nav-wrap{
    position:relative; z-index:2; margin-top:-18px; padding:0 12px;
  }
  .nav{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    max-width:640px; margin:0 auto;
  }
  .nav a{
    display:flex; align-items:center; gap:5px;
    padding:9px 14px; border-radius:24px;
    background:var(--card); color:var(--brand);
    font-size:13.5px; font-weight:600; text-decoration:none;
    box-shadow:0 1px 6px rgba(26,35,126,.1); border:1px solid transparent;
    transition:all .15s ease; white-space:nowrap;
  }
  .nav a:hover{background:var(--brand); color:#fff; border-color:var(--brand); transform:translateY(-1px)}
  .nav a .ico{font-size:15px}

  /* ── Main ── */
  .main{max-width:680px; margin:0 auto; padding:20px 14px 40px}

  /* ── Section header ── */
  .sec-head{
    display:flex; align-items:center; gap:8px;
    margin-bottom:14px; padding-bottom:10px;
    border-bottom:2px solid var(--brand);
  }
  .sec-head h2{font-size:17px; color:var(--brand); flex:1}
  .sec-head .all{font-size:12.5px; color:var(--accent); text-decoration:none; font-weight:500}
  .sec-head .all:hover{text-decoration:underline}

  /* ── Tabs ── */
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
  .tab{
    padding:6px 14px; border-radius:20px; font-size:13px; cursor:pointer;
    background:var(--card); color:var(--muted); border:1px solid var(--line);
    font-family:inherit; font-weight:500; transition:all .12s;
  }
  .tab.active{background:var(--brand); color:#fff; border-color:var(--brand)}
  .tab:hover:not(.active){background:#f0f0f5}

  /* ── Notice cards ── */
  .notice{
    background:var(--card); border-radius:var(--radius); padding:18px;
    margin-bottom:12px; box-shadow:var(--shadow);
    border-left:4px solid var(--brand);
    transition:transform .12s;
  }
  .notice:hover{transform:translateY(-1px)}
  .notice.cat-competition{border-left-color:#e65100}
  .notice.cat-schedule{border-left-color:#2e7d32}
  .notice .head{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap}
  .badge{
    font-size:11px; padding:2px 10px; border-radius:10px; font-weight:600; white-space:nowrap;
  }
  .badge.notice{background:#e8eaf6; color:#1a237e}
  .badge.competition{background:#fbe9e7; color:#bf360c}
  .badge.schedule{background:#e8f5e9; color:#1b5e20}
  .notice .ttl{font-weight:700; font-size:15.5px; color:var(--ink); flex:1; min-width:0}
  .notice .date{font-size:11.5px; color:#9ca3af; margin-bottom:8px}
  .notice .body{
    font-size:14px; color:#4b5563; line-height:1.7;
    white-space:pre-wrap; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .notice.open .body{-webkit-line-clamp:unset; overflow:visible}
  .notice .body a{color:var(--accent); text-decoration:underline}
  .toggle{
    background:none; border:none; color:var(--accent); font-size:12.5px;
    cursor:pointer; padding:6px 0 0; font-family:inherit; font-weight:500;
  }
  .att{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:10px; font-size:13px; color:var(--brand);
    background:var(--brand-light); padding:7px 13px; border-radius:8px; text-decoration:none;
  }
  .att:hover{background:#d5d9f0}

  .empty{text-align:center; color:var(--muted); font-size:14px; padding:40px 16px; line-height:1.8}
  .empty a{color:var(--accent)}

  /* ── Footer ── */
  footer{
    text-align:center; padding:20px 16px 30px; color:#9ca3af; font-size:11.5px; line-height:1.8;
  }
  footer img{height:32px; opacity:.5; margin-bottom:6px}

  /* ── Loading skeleton ── */
  .skeleton{
    background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);
    background-size:200% 100%; animation:shimmer 1.5s infinite;
    border-radius:var(--radius); height:120px; margin-bottom:12px;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header class="header">
  <div class="logo-row">
    <img src="mascot-track.png" alt="昌妹">
    <div class="logo-text">
      <h1>右昌體育</h1>
      <div class="sub">Youchang Athletics</div>
    </div>
    <img src="mascot-soccer.png" alt="右哥">
  </div>
</header>

<nav class="nav-wrap">
  <div class="nav" id="nav"></div>
</nav>

<main class="main">
  <div class="sec-head">
    <h2>📌 公佈欄</h2>
    <a class="all" id="allLink" href="#">查看全部 ›</a>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">全部</button>
    <button class="tab" data-cat="notice">通知事項</button>
    <button class="tab" data-cat="schedule">課表</button>
    <button class="tab" data-cat="competition">比賽資訊</button>
  </div>

  <div id="notices">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer>
  <img src="mascot-track.png" alt=""> <img src="mascot-soccer.png" alt=""><br>
  高雄市右昌國小體育班<br>
  <span id="foot"></span>
</footer>

<script>
// ─── 換主機時只要改這一行 ───
const API_BASE = 'https://pe-leave-system-production.up.railway.app';
// ─────────────────────────────

const NAV_ITEMS = [
  { href: '/',                             ico: '✏️', t: '申請請假' },
  { href: '/status',                       ico: '🔍', t: '查詢請假' },
  { href: '/api/notices/page/notice',      ico: '📣', t: '通知事項' },
  { href: '/api/schedule/page',            ico: '🗓️', t: '課表' },
  { href: '/api/notices/page/competition', ico: '🏅', t: '比賽資訊' },
  { href: '/admin',                        ico: '🔒', t: '管理後台' },
];

const CAT_META = {
  notice:      { label: '通知事項', cls: 'notice' },
  schedule:    { label: '課表',     cls: 'schedule' },
  competition: { label: '比賽資訊', cls: 'competition' },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const rich = s => esc(s).replace(
  /(https?:\/\/[^\s<]+)/g,
  '<a href="$1" target="_blank" rel="noreferrer">$1</a>'
);

// ── Nav ──
document.getElementById('nav').innerHTML = NAV_ITEMS.map(n =>
  `<a href="${API_BASE}${n.href}"><span class="ico">${n.ico}</span>${n.t}</a>`
).join('');

document.getElementById('allLink').href = API_BASE + '/api/notices/page';

// ── Notices ──
let allNotices = [];

async function loadNotices() {
  const box = document.getElementById('notices');
  try {
    const res = await fetch(`${API_BASE}/api/notices/public?limit=20`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    allNotices = json.data || [];
    renderNotices('all');
  } catch (err) {
    box.innerHTML = `<div class="empty">
      😥 暫時連不上系統，請稍後再試。<br>
      也可以直接前往 <a href="${API_BASE}/api/notices/page">公告專區</a>。
    </div>`;
  }
}

function renderNotices(cat) {
  const box = document.getElementById('notices');
  const list = cat === 'all' ? allNotices : allNotices.filter(n => n.category === cat);

  if (!list.length) {
    box.innerHTML = '<div class="empty">目前沒有公告</div>';
    return;
  }

  box.innerHTML = list.map((n, i) => {
    const c = CAT_META[n.category] || { label: n.category, cls: 'notice' };
    const att = n.attachmentUrl
      ? `<a class="att" href="${API_BASE}${n.attachmentUrl}" target="_blank" rel="noreferrer">📎 ${esc(n.attachmentName || '附件')}</a>`
      : '';
    return `
      <article class="notice cat-${n.category}" id="n${i}">
        <div class="head">
          <span class="badge ${c.cls}">${c.label}</span>
          <span class="ttl">${esc(n.title)}</span>
        </div>
        <div class="date">${esc((n.created_at || '').slice(0, 16))}</div>
        <div class="body">${rich(n.content)}</div>
        <button class="toggle" data-i="${i}">展開全文 ▾</button>
        ${att}
      </article>`;
  }).join('');

  // toggle
  box.querySelectorAll('.toggle').forEach(btn => {
    const art = document.getElementById('n' + btn.dataset.i);
    const body = art.querySelector('.body');
    if (body.scrollHeight <= body.clientHeight + 2) { btn.remove(); return; }
    btn.onclick = () => {
      art.classList.toggle('open');
      btn.textContent = art.classList.contains('open') ? '收合 ▴' : '展開全文 ▾';
    };
  });
}

// ── Tabs ──
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderNotices(btn.dataset.cat);
});

loadNotices();

document.getElementById('foot').textContent = '系統位置：' + API_BASE.replace(/^https?:\/\//, '');
</script>

</body>
</html>
